name: x_pense
description: "A modern expense tracking app with beautiful UI and powerful features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.3
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  csv: ^5.1.1
  intl: ^0.18.1
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.2
  local_auth: ^2.3.0
  fl_chart: ^1.1.1
  dropdown_button2: ^2.3.9
  crystal_navigation_bar: ^1.1.0
  glassmorphism: ^3.0.0
  motor: ^1.1.0
  oc_liquid_glass: ^0.2.1
  native_glass_navbar: ^1.0.1
  encrypt: ^5.0.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  cloud_firestore: ^6.3.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Custom app icon configuration
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default:48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
